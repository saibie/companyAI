{% for req in gatekeeper_requests %}
    <div style="background: rgba(30, 41, 59, 0.6); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 10px; padding: 12px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;">
        <div>
            <div style="font-weight: 700; color: #f59e0b; display: flex; align-items: center; gap: 8px;">
                <span class="badge-risk high">SANDBOX GATE</span> {{ req.action_type }}
            </div>
            <div style="font-size: 0.85rem; color: #94a3b8; margin-top: 4px;">
                Agent: <strong>{{ req.agent.name }}</strong> | Task: {{ req.task.title }}
            </div>
        </div>
        <div style="display: flex; gap: 8px;">
            <form hx-post="{% url 'corp:hx_gatekeeper_action' %}" hx-target="#gatekeeper-list-container" hx-swap="innerHTML" style="margin:0;">
                {% csrf_token %}
                <input type="hidden" name="request_id" value="{{ req.id }}">
                <input type="hidden" name="decision" value="approve">
                <button type="submit" class="btn btn-success" style="padding: 4px 12px; font-size: 0.85em;">Authorize</button>
            </form>
            <form hx-post="{% url 'corp:hx_gatekeeper_action' %}" hx-target="#gatekeeper-list-container" hx-swap="innerHTML" style="margin:0;">
                {% csrf_token %}
                <input type="hidden" name="request_id" value="{{ req.id }}">
                <input type="hidden" name="decision" value="reject">
                <button type="submit" class="btn btn-danger" style="padding: 4px 12px; font-size: 0.85em;">Deny</button>
            </form>
        </div>
    </div>
{% empty %}
    <div style="color: #94a3b8; padding: 8px; font-size: 0.9em;">
        🛡️ No pending high-risk sandbox approval requests. System physically consistent.
    </div>
{% endfor %}
