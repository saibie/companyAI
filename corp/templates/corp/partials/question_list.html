<ul style="padding: 0; margin: 0; list-style: none;">
    {% for task in question_tasks %}
        <li style="background: rgba(30, 41, 59, 0.85); border: 1px solid rgba(245, 158, 11, 0.3); padding: 18px; margin-bottom: 16px; border-radius: 12px;">
            <div style="font-weight: bold; color: #f59e0b; margin-bottom: 8px; font-size: 0.95rem;">
                ❓ Escalation Question from 🤖 {{ task.assignee.name }}
            </div>
            <div style="font-size: 1.05rem; font-weight: bold; color: #ffffff; margin-bottom: 12px;">{{ task.title }}</div>
            
            <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; margin-bottom: 14px;">
                <div style="background: rgba(15, 23, 42, 0.75); padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); max-height: 250px; overflow-y: auto; min-width: 0;">
                    <h4 style="margin: 0 0 6px 0; color: #00f2fe; font-size: 0.88rem;">📄 Description</h4>
                    <div style="font-size: 0.85rem; color: #e2e8f0; white-space: pre-wrap;">{{ task.description }}</div>
                </div>
                <div style="background: rgba(15, 23, 42, 0.75); padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); max-height: 250px; overflow-y: auto; min-width: 0;">
                    <h4 style="margin: 0 0 6px 0; color: #f59e0b; font-size: 0.88rem;">💬 Question / Reasoning</h4>
                    <div style="font-size: 0.85rem; color: #fde68a; white-space: pre-wrap;">{{ task.result }}</div>
                </div>
            </div>

            <form hx-post="{% url 'corp:hx_reply_question' %}" hx-target="#question-list-container" hx-swap="innerHTML" style="display: flex; gap: 8px;">
                {% csrf_token %}
                <input type="hidden" name="task_id" value="{{ task.id }}">
                <input type="text" name="answer" placeholder="Type your answer to guide agent..." required class="cos-input" style="flex: 1; padding: 8px 12px;">
                <button type="submit" class="btn-cos-send" style="padding: 8px 20px;">
                    Reply 💬
                </button>
            </form>
        </li>
    {% empty %}
        <li style="color: var(--text-muted); text-align: center; padding: 16px;">No pending questions.</li>
    {% endfor %}
</ul>
